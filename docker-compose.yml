services:
  mongo:
    image: mongo:7
    container_name: backend-ledger-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/admin", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    container_name: backend-ledger-app
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/backend-ledger
      APP_CURRENCY: THB
      CORS_ORIGINS: http://localhost:3000
      ACCESS_TOKEN_SECRET: compose-demo-access-secret-please-change-in-real-deployments
      REFRESH_TOKEN_SECRET: compose-demo-refresh-secret-please-change-in-real-deployments
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 7
      RATE_LIMIT_AUTH_WINDOW_MS: 60000
      RATE_LIMIT_AUTH_MAX: 10
      RATE_LIMIT_LOOKUP_WINDOW_MS: 60000
      RATE_LIMIT_LOOKUP_MAX: 30
      RATE_LIMIT_MONEY_WINDOW_MS: 60000
      RATE_LIMIT_MONEY_MAX: 20
      SYSTEM_USER_EMAIL: system.demo@backend-ledger.local
      SYSTEM_USER_PASSWORD: SystemPass123
      SYSTEM_USER_NAME: Backend Ledger System
      EMAIL_USER: ""
      CLIENT_ID: ""
      CLIENT_SECRET: ""
      EMAIL_REFRESH_TOKEN: ""
    command: >
      sh -c "npm run bootstrap && npm run seed:demo && npm run start"

volumes:
  mongo_data:
